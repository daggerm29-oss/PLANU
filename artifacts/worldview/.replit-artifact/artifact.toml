kind = "web"
previewPath = "/"
title = "WORLDVIEW"
version = "1.0.0"
id = "artifacts/worldview"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 21110

[services.development]
run = "pnpm --filter @workspace/worldview run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/worldview", "run", "build" ]
publicDir = "artifacts/worldview/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "21110"
BASE_PATH = "/"
